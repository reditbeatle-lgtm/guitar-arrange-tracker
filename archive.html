<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--text:#3a332e;--muted:#8a7f75;--border:#eaddd0;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:16px;}
header{padding:24px 0 8px;}
h1{font-size:1.8rem;margin:0 0 8px;color:var(--accent);}
.meta{color:var(--muted);font-size:.95rem;}
.backlink{display:inline-block;margin-bottom:12px;color:var(--accent);text-decoration:none;font-size:.95rem;}
.backlink:hover{text-decoration:underline;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:32px 0 16px;border-bottom:2px solid var(--border);padding-bottom:8px;}
h2{font-size:1.35rem;margin:0;color:var(--text);}
.playall{background:var(--accent);color:#fff;text-decoration:none;padding:8px 16px;border-radius:24px;font-size:.9rem;font-weight:600;white-space:nowrap;transition:background .2s,transform .2s;}
.playall:hover{background:#9c5f32;transform:translateY(-1px);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(181,113,63,.18);}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;}
.card-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.card-title{font-size:.98rem;font-weight:600;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-channel{font-size:.85rem;color:var(--accent);}
.card-date{font-size:.8rem;color:var(--muted);}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:12px;}
footer{margin:40px 0 20px;text-align:center;color:var(--muted);font-size:.85rem;}
ul.archive-list{list-style:none;padding:0;margin:16px 0;}
ul.archive-list li{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;transition:transform .2s,box-shadow .2s;}
ul.archive-list li:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(181,113,63,.15);}
ul.archive-list a{display:block;padding:14px 18px;text-decoration:none;color:var(--accent);font-weight:600;font-size:1.05rem;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新版へ</a>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">過去のアーカイブ一覧（1件）</div>
  </header>
  <ul class="archive-list">
      <li><a href="archive/2026-09-30.html">2026-09-30</a></li>
  </ul>
</div>
</body>
</html>
