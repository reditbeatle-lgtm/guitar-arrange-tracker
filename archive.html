<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--text:#3a3128;--muted:#8a7d6d;--border:#eadfd2;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
.backlink{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-size:.95rem;}
.backlink:hover{text-decoration:underline;}
header h1{margin:0 0 6px;font-size:1.8rem;color:var(--accent);}
.meta{color:var(--muted);font-size:.95rem;margin-bottom:24px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:2px solid var(--border);padding-bottom:8px;margin:34px 0 18px;}
.sec-head h2{margin:0;font-size:1.3rem;color:var(--text);}
.playall{background:var(--accent);color:#fff;text-decoration:none;padding:7px 14px;border-radius:8px;font-size:.9rem;white-space:nowrap;transition:background .15s;}
.playall:hover{background:#9c5f31;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(120,90,50,.16);}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;}
.card-title{font-size:.98rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-channel{color:var(--muted);font-size:.85rem;}
.card-date{color:var(--muted);font-size:.8rem;}
.empty{color:var(--muted);font-style:italic;padding:10px 0;}

    ul.archive-list{list-style:none;padding:0;}
    ul.archive-list li{margin:0 0 8px;}
    ul.archive-list a{color:var(--accent);text-decoration:none;font-size:1.05rem;}
    ul.archive-list a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新版へ</a>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">過去のアーカイブ一覧（1件）</div>
  </header>
  <ul class="archive-list">
      <li><a href="archive/2026-08-16.html">2026-08-16</a></li>
  </ul>
</div>
</body>
</html>
