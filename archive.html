<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --accent-dark:#9a5e32;
  --text:#3a332e; --muted:#8a7f76; --border:#ece5dc;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:16px;}
.backlink{display:inline-block;margin:8px 0 4px;color:var(--accent);text-decoration:none;font-size:.95rem;}
.backlink:hover{text-decoration:underline;}
header.page{padding:18px 0 10px;border-bottom:2px solid var(--border);margin-bottom:8px;}
header.page h1{margin:0 0 6px;font-size:1.8rem;color:var(--accent-dark);letter-spacing:.02em;}
.meta{color:var(--muted);font-size:.95rem;}
section.sec{margin-top:28px;}
.sec-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.sec-head h2{margin:0;font-size:1.3rem;color:var(--accent-dark);}
.playall{background:var(--accent);color:#fff;text-decoration:none;font-size:.9rem;
  padding:7px 14px;border-radius:999px;transition:background .15s,transform .15s;white-space:nowrap;}
.playall:hover{background:var(--accent-dark);transform:translateY(-1px);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  text-decoration:none;color:inherit;display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease;box-shadow:0 1px 3px rgba(80,60,40,.06);}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(120,80,45,.16);}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;}
.card-title{font-weight:600;font-size:1rem;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-ch{color:var(--accent-dark);font-size:.88rem;}
.card-date{color:var(--muted);font-size:.8rem;}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:14px;
  padding:28px;text-align:center;color:var(--muted);}
footer.page{margin:40px 0 20px;color:var(--muted);font-size:.8rem;text-align:center;}
@media (max-width:480px){header.page h1{font-size:1.45rem;}}

.arclist{list-style:none;padding:0;margin:18px 0;}
.arclist li{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;
  transition:transform .15s,box-shadow .15s;}
.arclist li:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(120,80,45,.14);}
.arclist a{display:block;padding:14px 18px;text-decoration:none;color:var(--accent-dark);font-weight:600;font-size:1.05rem;}
.arclist li.none{padding:18px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新版へ</a>
  <header class="page">
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">過去の収集結果一覧（全1日分）</div>
  </header>
  <ul class="arclist">
    <li><a href="archive/2026-11-26.html">2026-11-26</a></li>
  </ul>
  <footer class="page">日付の新しい順に表示しています。</footer>
</div>
</body>
</html>
