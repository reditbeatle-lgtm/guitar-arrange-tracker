<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
    :root { --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --text:#3a3229; --muted:#8a7d6f; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; line-height:1.6; }
    .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
    .backlink { display:inline-block; color:var(--accent); text-decoration:none; font-size:14px; margin-bottom:12px; }
    .backlink:hover { text-decoration:underline; }
    header h1 { margin:0 0 6px; font-size:26px; color:var(--accent); }
    .meta { color:var(--muted); font-size:14px; margin-bottom:24px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; border-bottom:2px solid #ece3d8; padding-bottom:8px; margin:32px 0 18px; }
    .section-head h2 { margin:0; font-size:20px; }
    .count { color:var(--muted); font-size:15px; font-weight:normal; }
    .play-all { background:var(--accent); color:#fff; text-decoration:none; padding:7px 14px; border-radius:20px; font-size:14px; white-space:nowrap; transition:background .15s; }
    .play-all:hover { background:#9c5f32; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
    .card { background:var(--card); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; box-shadow:0 1px 3px rgba(0,0,0,.08); transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column; }
    .card:hover { transform:translateY(-4px); box-shadow:0 6px 16px rgba(0,0,0,.14); }
    .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; background:#eee; display:block; }
    .card-body { padding:10px 12px 14px; }
    .card-title { font-size:14px; font-weight:600; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-channel { font-size:13px; color:var(--muted); }
    .card-date { font-size:12px; color:var(--muted); margin-top:2px; }
    .empty { color:var(--muted); font-style:italic; }
    .arch-list { list-style:none; padding:0; }
    .arch-list li { margin:0; }
    .arch-list a { display:inline-block; color:var(--accent); text-decoration:none; padding:8px 0; font-size:16px; }
    .arch-list a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="backlink" href="index.html">← 最新版へ</a>
    <header>
      <h1>ギターアレンジ・トラッカー アーカイブ</h1>
      <div class="meta">過去の全アーカイブ (1件)</div>
    </header>
    <ul class="arch-list">
        <li><a href="archive/2026-08-20.html">2026-08-20</a></li>
    </ul>
  </div>
</body>
</html>
