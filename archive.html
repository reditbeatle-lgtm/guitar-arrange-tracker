<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギターアレンジ・トラッカー アーカイブ</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --accent: #b5713f;
      --text: #3a332e;
      --muted: #8a7f76;
      --border: #ece5dd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    .back { display: inline-block; color: var(--accent); font-size: 0.95rem; margin-bottom: 12px; }
    .back:hover { text-decoration: underline; }
    header h1 { font-size: 1.8rem; margin: 4px 0 6px; color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
    .section { margin-bottom: 40px; }
    .section-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 18px;
    }
    .section-head h2 { font-size: 1.25rem; margin: 0; }
    .count { color: var(--muted); font-weight: normal; font-size: 0.95rem; }
    .play-all {
      background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600; transition: transform .15s, box-shadow .15s;
    }
    .play-all:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(181,113,63,.35); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .card {
      background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
      border: 1px solid var(--border); transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 24px rgba(58,51,46,.13); }
    .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #eee; }
    .card-body { padding: 12px 14px 16px; }
    .card-title { font-size: 0.98rem; margin: 0 0 6px; line-height: 1.35; }
    .card-channel { font-size: 0.85rem; color: var(--accent); margin: 0 0 4px; }
    .card-date { font-size: 0.78rem; color: var(--muted); margin: 0; }
    .empty { color: var(--muted); font-style: italic; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 40px; }
    ul.archive-list { list-style: none; padding: 0; }
    ul.archive-list li {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 10px; transition: transform .15s, box-shadow .15s;
    }
    ul.archive-list li:hover { transform: translateX(4px); box-shadow: 0 4px 12px rgba(58,51,46,.1); }
    ul.archive-list a { display: block; padding: 14px 18px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 最新版へ</a>
    <header>
      <h1>ギターアレンジ・トラッカー アーカイブ</h1>
      <p class="meta">過去のトラッキング結果一覧（1 日分）</p>
    </header>
    <ul class="archive-list">
        <li><a href="archive/2026-09-13.html">2026-09-13</a></li>
    </ul>
    <footer>ギターアレンジ・トラッカー</footer>
  </div>
</body>
</html>
