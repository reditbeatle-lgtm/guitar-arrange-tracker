<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギターアレンジ・トラッカー アーカイブ</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --accent: #b5713f;
      --text: #3a2f28;
      --muted: #8a7d72;
      --border: #ece5dd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 0.95rem; margin-bottom: 16px; }
    .back:hover { text-decoration: underline; }
    header h1 { font-size: 1.8rem; margin: 0 0 8px; color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.95rem; margin: 0 0 32px; }
    .section { margin-bottom: 48px; }
    .section-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
    .section-head h2 { font-size: 1.35rem; margin: 0; flex: 1 1 auto; }
    .count { color: var(--muted); font-size: 0.95rem; font-weight: normal; }
    .play-all {
      background: var(--accent); color: #fff; text-decoration: none;
      padding: 8px 16px; border-radius: 999px; font-size: 0.9rem; white-space: nowrap;
      transition: background 0.2s, transform 0.2s;
    }
    .play-all:hover { background: #9c5e30; transform: translateY(-1px); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .card {
      background: var(--card); border-radius: 12px; overflow: hidden;
      text-decoration: none; color: inherit; border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(80,60,40,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(120,90,50,0.16); }
    .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #eee; }
    .card-body { padding: 12px 14px 16px; }
    .card-title { font-size: 0.98rem; margin: 0 0 6px; line-height: 1.4; }
    .card-channel { font-size: 0.85rem; color: var(--accent); margin: 0 0 4px; }
    .card-date { font-size: 0.8rem; color: var(--muted); margin: 0; }
    .empty { color: var(--muted); font-style: italic; }
    footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 40px; }

    ul.archive { list-style: none; padding: 0; }
    ul.archive li {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 10px; transition: transform 0.2s, box-shadow 0.2s;
    }
    ul.archive li:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(120,90,50,0.14); }
    ul.archive li a { display: block; padding: 14px 18px; text-decoration: none; color: var(--accent); font-size: 1.05rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 最新版へ</a>
    <header>
      <h1>ギターアレンジ・トラッカー アーカイブ</h1>
      <p class="meta">過去の検索結果一覧（全 1日分）</p>
    </header>
    <ul class="archive">
      <li><a href="archive/2026-09-25.html">2026-09-25</a></li>
    </ul>
  </div>
</body>
</html>
