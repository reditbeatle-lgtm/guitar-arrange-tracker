<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--accent-dark:#8f562d;--text:#3a332e;--muted:#8a7f75;--border:#ece5dc;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
.topbar{margin-bottom:8px;}
.topbar a{color:var(--accent);text-decoration:none;font-size:.95rem;}
.topbar a:hover{text-decoration:underline;}
header h1{font-size:1.8rem;margin:.2em 0 .1em;color:var(--accent-dark);}
.meta{color:var(--muted);font-size:.95rem;margin-bottom:1.5em;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:6px;margin:2em 0 1em;}
.section-head h2{font-size:1.3rem;margin:0;color:var(--accent-dark);}
.playall{background:var(--accent);color:#fff;text-decoration:none;padding:7px 14px;border-radius:22px;font-size:.9rem;font-weight:600;white-space:nowrap;transition:background .15s;}
.playall:hover{background:var(--accent-dark);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .16s ease,box-shadow .16s ease;box-shadow:0 1px 3px rgba(60,40,20,.06);}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 22px rgba(120,80,40,.18);}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;}
.card-body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;}
.card-title{font-size:.98rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-channel{color:var(--accent-dark);font-size:.85rem;}
.card-date{color:var(--muted);font-size:.8rem;}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--muted);}
footer{margin-top:3em;color:var(--muted);font-size:.8rem;text-align:center;}

.arclist{list-style:none;padding:0;max-width:420px;}
.arclist li{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(60,40,20,.06);transition:transform .16s,box-shadow .16s;}
.arclist li:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(120,80,40,.15);}
.arclist a{display:block;padding:14px 18px;text-decoration:none;color:var(--accent-dark);font-weight:600;font-size:1.05rem;}
.arclist li.none{padding:14px 18px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="index.html">← 最新のトラッカーへ</a></div>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">過去の検索結果一覧（全 1 件）</div>
  </header>
  <ul class="arclist">
      <li><a href="archive/2026-08-29.html">2026-08-29</a></li>
  </ul>
</div>
</body>
</html>
