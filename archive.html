<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--text:#3a332e;--muted:#8a7f76;--border:#ece4da;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.5;padding:0 16px 48px;}
.wrap{max-width:1100px;margin:0 auto;}
.backlink{display:inline-block;margin:20px 0 4px;color:var(--accent);text-decoration:none;font-size:14px;font-weight:600;}
.backlink:hover{text-decoration:underline;}
header h1{font-size:28px;color:var(--accent);margin-top:8px;}
.meta{color:var(--muted);font-size:14px;margin-top:6px;}
.section-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:36px 0 18px;padding-bottom:10px;border-bottom:2px solid var(--border);}
.section-head h2{font-size:20px;color:var(--text);}
.playall{background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;white-space:nowrap;transition:transform .15s,box-shadow .15s;}
.playall:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(181,113,63,.35);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease;}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(58,51,46,.13);}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;}
.card-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.card-title{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-channel{font-size:12px;color:var(--accent);font-weight:600;}
.card-date{font-size:11px;color:var(--muted);}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:28px;text-align:center;color:var(--muted);}
footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center;}

.arclist{list-style:none;margin:24px 0;padding:0;}
.arclist li{margin:0 0 10px;}
.arclist a{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;text-decoration:none;color:var(--accent);font-weight:600;transition:transform .15s,box-shadow .15s;}
.arclist a:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(58,51,46,.12);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新版へ</a>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">過去の収集結果一覧（全 1 日分）</div>
  </header>
  <ul class="arclist">
      <li><a href="archive/2026-08-26.html">2026-08-26</a></li>
  </ul>
</div>
</body>
</html>
