<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
    :root { --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --text:#3a3129; --muted:#8a7d6f; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      line-height:1.5; }
    .wrap { max-width: 1100px; margin:0 auto; padding: 16px; }
    .back { display:inline-block; color:var(--accent); text-decoration:none; font-size:0.9rem; margin-bottom:12px; }
    .back:hover { text-decoration:underline; }
    header h1 { margin:0 0 6px; font-size:1.7rem; color:var(--accent); }
    header .sub { color:var(--muted); font-size:0.95rem; margin-bottom:8px; }
    .sec-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
      border-bottom:2px solid var(--accent); padding-bottom:8px; margin:28px 0 16px; }
    .sec-head h2 { margin:0; font-size:1.25rem; color:var(--text); }
    .playall { background:var(--accent); color:#fff; text-decoration:none; padding:7px 14px;
      border-radius:999px; font-size:0.85rem; white-space:nowrap; transition:background .15s; }
    .playall:hover { background:#9a5e30; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:16px; }
    .card { background:var(--card); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit;
      box-shadow:0 1px 3px rgba(80,60,40,.08); transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column; }
    .card:hover { transform:translateY(-4px); box-shadow:0 8px 20px rgba(80,60,40,.16); }
    .thumb { aspect-ratio:16/9; background:#eee; overflow:hidden; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .meta { padding:10px 12px 14px; }
    .title { font-weight:600; font-size:0.95rem; margin-bottom:6px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .channel { color:var(--accent); font-size:0.85rem; }
    .date { color:var(--muted); font-size:0.78rem; margin-top:4px; }
    .empty { color:var(--muted); font-style:italic; }
    footer { margin:40px 0 20px; color:var(--muted); font-size:0.8rem; text-align:center; }
    ul.arch { list-style:none; padding:0; margin:20px 0; }
    ul.arch li { margin:0 0 10px; }
    ul.arch a { display:inline-block; background:var(--card); color:var(--accent); text-decoration:none;
      padding:12px 18px; border-radius:10px; box-shadow:0 1px 3px rgba(80,60,40,.08);
      font-weight:600; transition:transform .15s, box-shadow .15s; }
    ul.arch a:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(80,60,40,.16); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 最新ページへ</a>
    <header>
      <h1>ギターアレンジ・トラッカー アーカイブ</h1>
      <div class="sub">過去の収集結果一覧 ／ 全 1 日分</div>
    </header>
    <ul class="arch">
        <li><a href="archive/2026-11-17.html">2026-11-17</a></li>
    </ul>
    <footer>日付の新しい順に表示しています。</footer>
  </div>
</body>
</html>
