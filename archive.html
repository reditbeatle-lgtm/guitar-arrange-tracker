<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --accent-dark:#9a5e32;
  --text:#3a332c; --muted:#8a7f72; --border:#ece5db;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:16px;}
.backlink{display:inline-block;color:var(--accent);text-decoration:none;font-size:.9rem;margin:8px 0;}
.backlink:hover{text-decoration:underline;}
header.page{padding:12px 0 20px;border-bottom:2px solid var(--border);margin-bottom:24px;}
header.page h1{margin:.2em 0;font-size:1.8rem;color:var(--accent-dark);}
header.page .meta{color:var(--muted);font-size:.95rem;}
.section-head{display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:32px 0 16px;}
.section-head h2{margin:0;font-size:1.3rem;color:var(--accent-dark);
  border-left:5px solid var(--accent);padding-left:10px;}
.playall{background:var(--accent);color:#fff;text-decoration:none;
  padding:8px 14px;border-radius:999px;font-size:.9rem;white-space:nowrap;
  transition:background .15s ease;}
.playall:hover{background:var(--accent-dark);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.card{display:block;background:var(--card);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:0 1px 3px rgba(60,40,20,.06);
  transition:transform .15s ease, box-shadow .15s ease;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(60,40,20,.14);}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#eee;}
.card .body{padding:10px 12px 14px;}
.card .title{font-weight:600;font-size:.98rem;margin:0 0 6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .channel{color:var(--muted);font-size:.85rem;margin:0;}
.card .date{color:var(--muted);font-size:.8rem;margin:4px 0 0;}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:12px;
  padding:28px;text-align:center;color:var(--muted);}
footer{margin:40px 0 20px;color:var(--muted);font-size:.8rem;text-align:center;}

    ul.archive-list{list-style:none;padding:0;margin:0;}
    ul.archive-list li{margin:0 0 10px;}
    ul.archive-list a{display:inline-block;background:var(--card);
      border:1px solid var(--border);border-radius:10px;padding:12px 18px;
      text-decoration:none;color:var(--accent-dark);font-weight:600;min-width:180px;
      transition:transform .15s ease, box-shadow .15s ease;}
    ul.archive-list a:hover{transform:translateY(-3px);
      box-shadow:0 6px 16px rgba(60,40,20,.12);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新ページへ</a>
  <header class="page">
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <p class="meta">過去の収集結果一覧（全1件）</p>
  </header>
  <ul class="archive-list">
      <li><a href="archive/2026-10-22.html">2026-10-22</a></li>
  </ul>
  <footer>過去24時間に投稿された動画を YouTube Data API で収集しています。</footer>
</div>
</body>
</html>
