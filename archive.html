<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
    :root{
      --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --accent-dark:#8f5729;
      --text:#3a322c; --muted:#8a7d70; --border:#ece5dc;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      line-height:1.6;}
    .wrap{max-width:1100px;margin:0 auto;padding:16px;}
    .back{display:inline-block;margin:8px 0 4px;color:var(--accent);text-decoration:none;font-size:.9rem;}
    .back:hover{text-decoration:underline;}
    header h1{margin:.2em 0 .1em;font-size:1.6rem;color:var(--accent-dark);}
    .meta{color:var(--muted);font-size:.9rem;margin-bottom:8px;}
    .section-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;
      margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border);}
    .section-head h2{margin:0;font-size:1.25rem;color:var(--accent-dark);}
    .count{color:var(--muted);font-size:.85rem;font-weight:normal;}
    .play-all{background:var(--accent);color:#fff;text-decoration:none;
      padding:6px 14px;border-radius:20px;font-size:.85rem;white-space:nowrap;
      transition:background .15s;}
    .play-all:hover{background:var(--accent-dark);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
      overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;
      transition:transform .15s ease,box-shadow .15s ease;}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(120,80,40,.15);}
    .thumb-wrap{aspect-ratio:16/9;background:#eee;overflow:hidden;}
    .thumb{width:100%;height:100%;object-fit:cover;display:block;}
    .card-body{padding:10px 12px;}
    .card-title{font-weight:600;font-size:.92rem;margin-bottom:4px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-channel{color:var(--muted);font-size:.82rem;}
    .card-date{color:var(--muted);font-size:.78rem;margin-top:2px;}
    .empty{color:var(--muted);padding:12px 0;}
    footer{margin:40px 0 20px;color:var(--muted);font-size:.8rem;text-align:center;}
    .arc-list{list-style:none;padding:0;}
    .arc-list li{background:var(--card);border:1px solid var(--border);border-radius:10px;
      margin:8px 0;transition:transform .15s,box-shadow .15s;}
    .arc-list li:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(120,80,40,.12);}
    .arc-list a{display:block;padding:12px 16px;color:var(--accent-dark);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 最新版へ</a>
    <header>
      <h1>ギターアレンジ・トラッカー アーカイブ</h1>
      <div class="meta">過去のアーカイブ一覧（1件）</div>
    </header>
    <section>
      <ul class="arc-list">
        <li><a href="archive/2026-09-24.html">2026-09-24</a></li>
      </ul>
    </section>
    <footer>YouTube Data API による自動収集</footer>
  </div>
</body>
</html>
