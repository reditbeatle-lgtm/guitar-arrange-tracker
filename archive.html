<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --accent: #b5713f;
      --text: #3a332e;
      --muted: #8a7f76;
      --border: #ece4da;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 64px; }
    .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 14px; margin-bottom: 12px; }
    .back:hover { text-decoration: underline; }
    header h1 { margin: 4px 0 6px; font-size: 28px; color: var(--accent); }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      border-bottom: 2px solid var(--border);
      margin: 34px 0 18px; padding-bottom: 8px;
    }
    .section-head h2 { margin: 0; font-size: 20px; }
    .count { color: var(--muted); font-size: 15px; font-weight: normal; }
    .play-all {
      background: var(--accent); color: #fff; text-decoration: none;
      padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap;
      transition: background .15s ease;
    }
    .play-all:hover { background: #9c5f33; }
    .grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(181,113,63,.18); }
    .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #eee; }
    .card-body { padding: 12px 14px; }
    .card-title { font-weight: 600; font-size: 14px; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-channel { color: var(--accent); font-size: 13px; }
    .card-date { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
    footer { margin-top: 48px; color: var(--muted); font-size: 12px; text-align: center; }
    ul.archive-list { list-style: none; padding: 0; }
    ul.archive-list li { margin: 0 0 10px; }
    ul.archive-list a {
      display: inline-block; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px; text-decoration: none; color: var(--accent);
      font-size: 16px; font-weight: 600; transition: transform .15s ease, box-shadow .15s ease;
    }
    ul.archive-list a:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(181,113,63,.18); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 最新版へ</a>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">過去の全アーカイブ（日付の新しい順）</div>
  </header>
  <ul class="archive-list">
      <li><a href="archive/2026-09-06.html">2026-09-06</a></li>
  </ul>
</div>
</body>
</html>
