<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#faf8f5;color:#3a2f28;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.back{display:inline-block;margin-bottom:14px;color:#b5713f;text-decoration:none;font-size:.95rem}
.back:hover{text-decoration:underline}
h1{font-size:1.8rem;margin:.2em 0 .1em;color:#7a4a24}
.meta{color:#8a7d72;font-size:.95rem;margin-bottom:8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:34px 0 14px;border-bottom:2px solid #e7ddd2;padding-bottom:8px}
.sec-head h2{font-size:1.3rem;margin:0;color:#7a4a24}
.playall{background:#b5713f;color:#fff;text-decoration:none;padding:8px 14px;border-radius:22px;font-size:.9rem;font-weight:600;white-space:nowrap;transition:background .2s}
.playall:hover{background:#9a5c2f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:block;background:#fff;border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(90,60,30,.08);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(90,60,30,.16)}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#eee}
.card-body{padding:11px 13px 14px}
.card-title{font-size:.98rem;font-weight:600;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-ch{font-size:.85rem;color:#b5713f;margin:0 0 3px}
.card-date{font-size:.78rem;color:#8a7d72;margin:0}
.empty{background:#fff;border-radius:12px;padding:30px;text-align:center;color:#8a7d72}
footer{margin-top:40px;text-align:center;color:#a89a8d;font-size:.8rem}

ul.arch{list-style:none;padding:0;margin:20px 0}
ul.arch li{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(90,60,30,.08)}
ul.arch li a{display:block;padding:14px 18px;color:#7a4a24;text-decoration:none;font-weight:600}
ul.arch li a:hover{color:#b5713f}
</style>
