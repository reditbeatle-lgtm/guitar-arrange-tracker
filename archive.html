<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans','Noto Sans JP',sans-serif;background:#faf8f5;color:#3a332c;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.backlink{display:inline-block;margin-bottom:14px;color:#b5713f;font-size:.95rem}
.backlink:hover{text-decoration:underline}
header.top{border-bottom:2px solid #ece3d8;padding-bottom:16px;margin-bottom:24px}
header.top h1{margin:0 0 6px;font-size:1.8rem;color:#8a4f26}
header.top .meta{color:#8c8073;font-size:.95rem}
.section-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:34px 0 16px}
.section-head h2{margin:0;font-size:1.3rem;color:#6f4423;border-left:5px solid #b5713f;padding-left:10px}
.playall{background:#b5713f;color:#fff;padding:7px 14px;border-radius:22px;font-size:.9rem;font-weight:600;box-shadow:0 2px 5px rgba(181,113,63,.3);transition:background .15s,transform .15s}
.playall:hover{background:#9c5f31;transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{display:block;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(90,70,50,.08);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 22px rgba(90,70,50,.16)}
.card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#ede6dc}
.card .body{padding:12px 13px 15px}
.card .title{font-weight:600;font-size:.98rem;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ch{color:#8a4f26;font-size:.85rem;margin:0 0 3px}
.card .dt{color:#a49a8c;font-size:.8rem;margin:0}
.empty{background:#fff;border-radius:12px;padding:26px;text-align:center;color:#8c8073;box-shadow:0 2px 8px rgba(90,70,50,.08)}
footer{margin-top:40px;text-align:center;color:#a49a8c;font-size:.82rem}

ul.archive{list-style:none;padding:0;margin:10px 0 0}
ul.archive li{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(90,70,50,.08);transition:transform .15s,box-shadow .15s}
ul.archive li:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(90,70,50,.15)}
ul.archive li a{display:block;padding:14px 18px;font-weight:600;color:#6f4423}
ul.archive li a::before{content:'📅 ';}
ul.archive li.none{padding:18px;color:#8c8073}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新版へ</a>
  <header class="top">
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <p class="meta">過去のナイトリー検索結果 ・ 全 1 日分</p>
  </header>
  <ul class="archive">
    <li><a href="archive/2026-08-10.html">2026-08-10</a></li>
  </ul>
</div>
</body>
</html>
