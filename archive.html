<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  background: #faf8f5; color: #3a332c; line-height: 1.6;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.backlink { display: inline-block; margin-bottom: 14px; color: #b5713f; text-decoration: none; font-size: 0.95rem; }
.backlink:hover { text-decoration: underline; }
header h1 { margin: 4px 0 6px; font-size: 1.8rem; color: #7a4a1e; }
header .meta { color: #8a7f72; font-size: 0.95rem; margin-bottom: 8px; }
.section-head {
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
  margin: 34px 0 16px; padding-bottom: 8px; border-bottom: 2px solid #e7ddd0;
}
.section-head h2 { margin: 0; font-size: 1.3rem; color: #7a4a1e; }
.section-head .count { color: #8a7f72; font-size: 0.9rem; }
.playall {
  margin-left: auto; background: #b5713f; color: #fff; text-decoration: none;
  padding: 8px 16px; border-radius: 999px; font-size: 0.9rem; font-weight: 600;
  transition: background .15s ease, transform .15s ease;
}
.playall:hover { background: #9c5e30; transform: translateY(-1px); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.card {
  display: block; background: #fff; border-radius: 12px; overflow: hidden;
  text-decoration: none; color: inherit; border: 1px solid #eee4d6;
  box-shadow: 0 1px 3px rgba(120,90,50,0.06);
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-5px); box-shadow: 0 10px 22px rgba(120,90,50,0.16); }
.thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #efe7dc; }
.card-body { padding: 12px 14px 16px; }
.card-title { font-size: 0.98rem; font-weight: 600; margin: 0 0 8px; color: #3a332c;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-channel { font-size: 0.85rem; color: #b5713f; margin: 0 0 2px; }
.card-date { font-size: 0.8rem; color: #a99e90; margin: 0; }
.empty { background: #fff; border: 1px dashed #d9cbb8; border-radius: 12px;
  padding: 30px; text-align: center; color: #8a7f72; }
footer { margin-top: 40px; text-align: center; color: #b3a898; font-size: 0.82rem; }

ul.archive-list { list-style: none; padding: 0; margin: 20px 0 0; }
ul.archive-list li { margin: 0 0 10px; }
ul.archive-list a { display: inline-block; background: #fff; border: 1px solid #eee4d6;
  border-radius: 10px; padding: 12px 20px; color: #7a4a1e; text-decoration: none;
  font-size: 1.05rem; font-weight: 600; transition: transform .15s ease, box-shadow .15s ease; }
ul.archive-list a:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(120,90,50,0.14); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="backlink" href="index.html">← 最新版へ</a>
    <header>
      <h1>ギターアレンジ・トラッカー アーカイブ</h1>
      <p class="meta">過去の検索結果一覧（全 1 日分）</p>
    </header>
    <ul class="archive-list">
        <li><a href="archive/2026-08-07.html">2026-08-07</a></li>
    </ul>
  </div>
</body>
</html>
