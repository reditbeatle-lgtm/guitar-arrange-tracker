<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --accent-dark:#8f5629;
  --text:#3a332e; --muted:#8a7f75; --border:#ece5dc;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6;
}
.wrap{max-width:1100px; margin:0 auto; padding:20px 16px 60px;}
.backlink{display:inline-block; margin-bottom:12px; color:var(--accent); text-decoration:none; font-size:.95rem;}
.backlink:hover{text-decoration:underline;}
header h1{margin:.2em 0 .1em; font-size:1.9rem; color:var(--accent-dark); letter-spacing:.02em;}
.meta{color:var(--muted); font-size:.95rem; margin-bottom:28px;}
.section{margin-top:36px;}
.section-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  border-bottom:2px solid var(--border); padding-bottom:8px; margin-bottom:20px;}
.section-head h2{margin:0; font-size:1.35rem; color:var(--accent-dark);}
.playall{background:var(--accent); color:#fff; text-decoration:none; padding:8px 16px; border-radius:22px;
  font-size:.9rem; font-weight:600; white-space:nowrap; transition:background .15s ease, transform .15s ease;}
.playall:hover{background:var(--accent-dark); transform:translateY(-1px);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;
  text-decoration:none; color:inherit; display:flex; flex-direction:column;
  box-shadow:0 1px 3px rgba(90,60,30,.06); transition:transform .18s ease, box-shadow .18s ease;}
.card:hover{transform:translateY(-5px); box-shadow:0 10px 24px rgba(90,60,30,.16);}
.thumb{width:100%; aspect-ratio:16/9; object-fit:cover; background:#efe8df; display:block;}
.card-body{padding:12px 14px 16px;}
.card-title{font-weight:600; font-size:1rem; margin:0 0 8px; color:var(--text);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.card-channel{color:var(--accent-dark); font-size:.88rem; margin:0 0 4px;}
.card-date{color:var(--muted); font-size:.8rem; margin:0;}
.empty{background:var(--card); border:1px dashed var(--border); border-radius:12px; padding:40px 20px;
  text-align:center; color:var(--muted);}
footer{margin-top:50px; text-align:center; color:var(--muted); font-size:.8rem;}

.archive-list{list-style:none; padding:0; margin:0;}
.archive-list li{background:var(--card); border:1px solid var(--border); border-radius:10px;
  margin-bottom:10px; transition:transform .15s ease, box-shadow .15s ease;}
.archive-list li:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(90,60,30,.12);}
.archive-list a{display:block; padding:14px 18px; text-decoration:none; color:var(--accent-dark); font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新ページへ</a>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <p class="meta">過去の収集結果一覧（全1件）</p>
  </header>
  <ul class="archive-list">
      <li><a href="archive/2026-10-08.html">2026-10-08</a></li>
  </ul>
  <footer>YouTube Data API によるギター動画の自動収集</footer>
</div>
</body>
</html>
