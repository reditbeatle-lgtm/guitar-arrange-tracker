<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
    :root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--text:#3a3330;--muted:#8a8078;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif;line-height:1.6;}
    .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
    .back{display:inline-block;color:var(--accent);text-decoration:none;font-size:.9rem;margin-bottom:14px;}
    .back:hover{text-decoration:underline;}
    header h1{margin:.2em 0;font-size:1.7rem;color:var(--accent);}
    .sub{color:var(--muted);font-size:.95rem;margin-bottom:26px;}
    .sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #ece3d8;padding-bottom:8px;margin:34px 0 18px;}
    .sechead h2{font-size:1.25rem;margin:0;color:var(--text);}
    .count{color:var(--muted);font-weight:normal;font-size:1rem;}
    .playall{background:var(--accent);color:#fff;text-decoration:none;padding:8px 14px;border-radius:22px;font-size:.85rem;white-space:nowrap;transition:background .15s;}
    .playall:hover{background:#9c5f31;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
    .card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(90,70,50,.08);transition:transform .15s ease,box-shadow .15s ease;display:flex;flex-direction:column;}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(90,70,50,.16);}
    .thumb{aspect-ratio:16/9;background:#eee;overflow:hidden;}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .meta{padding:11px 13px 15px;}
    .ctitle{font-size:.92rem;font-weight:600;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .channel{font-size:.82rem;color:var(--accent);}
    .date{font-size:.76rem;color:var(--muted);margin-top:3px;}
    .empty{color:var(--muted);padding:10px 0;}
    footer{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center;}
    .arclist{list-style:none;padding:0;}
    .arclist li{margin:0;}
    .arclist a{display:block;background:var(--card);border-radius:10px;padding:14px 18px;margin-bottom:10px;text-decoration:none;color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(90,70,50,.08);transition:transform .15s,box-shadow .15s;}
    .arclist a:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(90,70,50,.16);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 最新版へ</a>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>

  </header>
  <ul class="arclist">

  </ul>
</div>
</body>
</html>
