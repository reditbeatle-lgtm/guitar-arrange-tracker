<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--text:#3a332e;--muted:#8a7f76;--border:#eadfd3;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:16px;}
a{color:inherit;text-decoration:none;}
.backlink{display:inline-block;margin:8px 0 4px;color:var(--accent);font-weight:600;}
.backlink:hover{text-decoration:underline;}
header h1{font-size:1.9rem;margin:.2em 0 .1em;color:var(--accent);}
.meta{color:var(--muted);font-size:.95rem;margin-bottom:1.2em;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--border);padding-bottom:6px;margin:1.6em 0 1em;}
.section-head h2{font-size:1.3rem;margin:0;color:var(--text);}
.playall{background:var(--accent);color:#fff;padding:8px 14px;border-radius:999px;font-size:.9rem;font-weight:600;white-space:nowrap;transition:transform .15s,box-shadow .15s;}
.playall:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(181,113,63,.35);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(58,51,46,.13);}
.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#eee;}
.card .body{padding:10px 12px 14px;}
.card .title{font-weight:600;font-size:.98rem;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .ch{color:var(--accent);font-size:.86rem;margin:0 0 2px;}
.card .dt{color:var(--muted);font-size:.8rem;}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:32px;text-align:center;color:var(--muted);}
footer{margin:2.4em 0 1em;color:var(--muted);font-size:.82rem;text-align:center;}
ul.archlist{list-style:none;padding:0;}
ul.archlist li{background:var(--card);border:1px solid var(--border);border-radius:10px;margin:8px 0;padding:12px 16px;transition:transform .15s,box-shadow .15s;}
ul.archlist li:hover{transform:translateX(4px);box-shadow:0 4px 12px rgba(58,51,46,.1);}
ul.archlist a{color:var(--accent);font-weight:600;}
</style>
</head>
<body>
  <div class="wrap">
    <a class="backlink" href="index.html">← 最新版へ</a>
    <header>
      <h1>ギターアレンジ・トラッカー アーカイブ</h1>
      <p class="meta">過去のアーカイブ一覧（全 1 日分）</p>
    </header>
    <ul class="archlist">
      <li><a href="archive/2026-09-16.html">2026-09-16</a></li>
    </ul>
    <footer>YouTube Data API を用いた自動収集</footer>
  </div>
</body>
</html>
