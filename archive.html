<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root { --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --text:#3a332e; --muted:#8a7f74; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6; }
.wrap { max-width:1100px; margin:0 auto; padding:20px 16px 48px; }
.back { display:inline-block; margin-bottom:12px; color:var(--accent); text-decoration:none; font-weight:600; }
.back:hover { text-decoration:underline; }
h1 { font-size:1.8rem; margin:0.2em 0 0.1em; color:var(--accent); }
.meta { color:var(--muted); margin-bottom:24px; font-size:0.95rem; }
.section-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  gap:10px; border-bottom:2px solid var(--accent); padding-bottom:8px; margin:32px 0 18px; }
.section-head h2 { margin:0; font-size:1.3rem; color:var(--text); }
.playall { background:var(--accent); color:#fff; text-decoration:none; padding:8px 14px;
  border-radius:20px; font-size:0.9rem; font-weight:600; white-space:nowrap;
  transition:background .2s, transform .2s; }
.playall:hover { background:#9c5f31; transform:translateY(-1px); }
.playall.disabled { background:#cfc4b8; pointer-events:none; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
.card { display:block; background:var(--card); border-radius:12px; overflow:hidden;
  text-decoration:none; color:inherit; box-shadow:0 1px 3px rgba(0,0,0,.08);
  transition:transform .18s ease, box-shadow .18s ease; }
.card:hover { transform:translateY(-5px); box-shadow:0 10px 22px rgba(0,0,0,.14); }
.card img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; background:#eee; }
.card .body { padding:12px 14px 16px; }
.card .title { font-weight:600; font-size:0.98rem; margin:0 0 6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .ch { color:var(--accent); font-size:0.86rem; margin:0 0 2px; }
.card .date { color:var(--muted); font-size:0.8rem; margin:0; }
.empty { color:var(--muted); font-style:italic; padding:12px 0; }
.archive-list { list-style:none; padding:0; }
.archive-list li { margin:0; }
.archive-list a { display:block; background:var(--card); border-radius:10px; padding:14px 18px;
  margin-bottom:10px; text-decoration:none; color:var(--accent); font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.08); transition:transform .18s, box-shadow .18s; }
.archive-list a:hover { transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,.12); }
footer { color:var(--muted); font-size:0.82rem; margin-top:40px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 最新版へ</a>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <p class="meta">過去のアーカイブ一覧（新しい順・1件）</p>
    <ul class="archive-list">
      <li><a href="archive/2026-08-01.html">- 2026-08-01</a></li>
    </ul>
    <footer>YouTube Data API で毎晩自動収集</footer>
  </div>
</body>
</html>
