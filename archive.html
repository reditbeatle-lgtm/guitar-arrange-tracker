<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --accent:#b5713f; --accent-dark:#8f5729;
  --text:#3a332c; --muted:#8a7f72; --border:#ece5db;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 56px;}
.backlink{display:inline-block;margin-bottom:16px;color:var(--accent);
  text-decoration:none;font-size:.95rem;}
.backlink:hover{text-decoration:underline;}
header.page{border-bottom:2px solid var(--border);padding-bottom:18px;margin-bottom:28px;}
header.page h1{margin:0 0 8px;font-size:1.9rem;color:var(--accent-dark);letter-spacing:.02em;}
.meta{color:var(--muted);font-size:.95rem;}
.section-head{display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;margin:36px 0 18px;border-left:5px solid var(--accent);
  padding-left:12px;}
.section-head h2{margin:0;font-size:1.35rem;color:var(--accent-dark);}
.playall{background:var(--accent);color:#fff;text-decoration:none;
  padding:8px 16px;border-radius:999px;font-size:.9rem;font-weight:600;
  white-space:nowrap;transition:background .2s,transform .15s;}
.playall:hover{background:var(--accent-dark);transform:translateY(-1px);}
.playall.disabled{background:var(--border);color:var(--muted);pointer-events:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
.card{display:block;background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;
  transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 1px 3px rgba(90,60,30,.06);}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(90,60,30,.16);}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;}
.card .body{padding:12px 14px 16px;}
.card .title{font-weight:600;font-size:1rem;margin:0 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .channel{color:var(--accent-dark);font-size:.88rem;margin:0 0 2px;}
.card .date{color:var(--muted);font-size:.8rem;margin:0;}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:14px;
  padding:28px;text-align:center;color:var(--muted);}
footer.page{margin-top:48px;padding-top:18px;border-top:1px solid var(--border);
  color:var(--muted);font-size:.82rem;text-align:center;}

.archive-list{list-style:none;padding:0;margin:0;}
.archive-list li{background:var(--card);border:1px solid var(--border);
  border-radius:12px;margin-bottom:10px;transition:transform .2s,box-shadow .2s;}
.archive-list li:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(90,60,30,.14);}
.archive-list li.none{padding:18px;color:var(--muted);}
.archive-list a{display:block;padding:16px 20px;text-decoration:none;
  color:var(--accent-dark);font-weight:600;font-size:1.05rem;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">← 最新版へ</a>
  <header class="page">
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <p class="meta">過去の収集結果一覧（全1日分）</p>
  </header>
  <ul class="archive-list">
        <li><a href="archive/2026-10-11.html">2026-10-11</a></li>
  </ul>
  <footer class="page">
    YouTube Data API による自動収集
  </footer>
</div>
</body>
</html>
