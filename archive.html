<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
:root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--text:#3a332e;--muted:#8a7f76;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6;}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px;}
.backlink{display:inline-block;color:var(--accent);text-decoration:none;font-size:.95rem;margin-bottom:12px;}
.backlink:hover{text-decoration:underline;}
h1{font-size:1.9rem;margin:.2em 0 .1em;color:var(--accent);}
.meta{color:var(--muted);font-size:.95rem;margin-bottom:24px;}
.section-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:36px 0 16px;border-bottom:2px solid #ece4db;padding-bottom:8px;}
h2{font-size:1.35rem;margin:0;color:var(--text);}
.playall{background:var(--accent);color:#fff;text-decoration:none;padding:7px 14px;border-radius:20px;font-size:.9rem;font-weight:600;transition:background .2s,transform .2s;}
.playall:hover{background:#9c5f31;transform:translateY(-1px);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
.card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;
box-shadow:0 1px 4px rgba(80,60,40,.08);transition:transform .18s ease,box-shadow .18s ease;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(120,80,40,.18);}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;}
.card-title{font-size:.98rem;font-weight:600;line-height:1.35;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-channel{color:var(--accent);font-size:.85rem;}
.card-date{color:var(--muted);font-size:.8rem;}
.empty{background:var(--card);border-radius:12px;padding:28px;text-align:center;color:var(--muted);}
footer{margin-top:48px;color:var(--muted);font-size:.85rem;text-align:center;}
.arch-list{list-style:none;padding:0;}
.arch-list li{background:var(--card);border-radius:10px;margin-bottom:10px;box-shadow:0 1px 4px rgba(80,60,40,.08);}
.arch-list a{display:block;padding:14px 18px;text-decoration:none;color:var(--accent);font-weight:600;font-size:1.05rem;}
.arch-list a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="wrap">
    <a class="backlink" href="index.html">← 最新版へ</a>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">全 1 件のアーカイブ</div>
    <ul class="arch-list">
      <li><a href="archive/2026-08-03.html">2026-08-03</a></li>
    </ul>
  </div>
</body>
</html>
