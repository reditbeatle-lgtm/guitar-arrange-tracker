<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターアレンジ・トラッカー アーカイブ</title>
<style>
    :root{--bg:#faf8f5;--card:#ffffff;--accent:#b5713f;--text:#3a2f28;--muted:#8a7d72;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.5;}
    .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
    .back{display:inline-block;color:var(--accent);text-decoration:none;font-size:.9rem;margin-bottom:12px;}
    .back:hover{text-decoration:underline;}
    header h1{margin:.2em 0;font-size:1.8rem;color:var(--accent);}
    .meta{color:var(--muted);font-size:.9rem;margin-bottom:24px;}
    .section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:2px solid #e7ddd2;padding-bottom:8px;margin:32px 0 18px;}
    .section-head h2{margin:0;font-size:1.3rem;}
    .count{color:var(--muted);font-size:.9rem;font-weight:normal;}
    .play-all{background:var(--accent);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:.85rem;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15);}
    .play-all:hover{background:#9c5f32;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
    .card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:transform .15s ease,box-shadow .15s ease;display:flex;flex-direction:column;}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.14);}
    .thumb-wrap{aspect-ratio:16/9;background:#eee;overflow:hidden;}
    .thumb{width:100%;height:100%;object-fit:cover;display:block;}
    .card-body{padding:10px 12px 14px;}
    .card-title{font-size:.92rem;font-weight:600;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-channel{font-size:.8rem;color:var(--accent);margin-bottom:2px;}
    .card-date{font-size:.75rem;color:var(--muted);}
    .empty{color:var(--muted);font-style:italic;}
    footer{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center;}
    .arch-list{list-style:none;padding:0;}
    .arch-list li{background:var(--card);border-radius:10px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:transform .15s ease,box-shadow .15s ease;}
    .arch-list li:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.14);}
    .arch-list a{display:block;padding:14px 18px;text-decoration:none;color:var(--accent);font-weight:600;font-size:1.05rem;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 最新版へ</a>
  <header>
    <h1>ギターアレンジ・トラッカー アーカイブ</h1>
    <div class="meta">過去のアーカイブ一覧（1件）</div>
  </header>
  <section>
    <ul class="arch-list">
      <li><a href="archive/2026-07-25.html">2026-07-25</a></li>
    </ul>
  </section>
  <footer>過去24時間以内に投稿された動画を YouTube Data API で自動収集しています。</footer>
</div>
</body>
</html>
